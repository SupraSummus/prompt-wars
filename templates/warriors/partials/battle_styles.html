{# The battle page's look: side colors, marks and game blocks; King of the Hill's pages include it too, so a battle reads the same on both. #}
<style>
  /*
    Warrior colors, see battle_sides.
    Each holds 4.5:1 contrast on every background of the page.
  */
  :root {
    --pw-side-1-color: #1a5fc8;
    --pw-side-2-color: #b93f0a;
  }
  @media only screen and (prefers-color-scheme: dark) {
    :root {
      --pw-side-1-color: #74aaff;
      --pw-side-2-color: #ff8f4d;
    }
  }
  .pw-side-1 { --pw-side: var(--pw-side-1-color); }
  .pw-side-2 { --pw-side: var(--pw-side-2-color); }

  .pw-dot {
    display: inline-block;
    flex-shrink: 0;
    width: 0.6em;
    height: 0.6em;
    margin-right: 0.4em;
    border-radius: 50%;
    background: var(--pw-side);
  }
  /* keeps the dot beside the name when a long name wraps */
  .pw-name {
    display: inline-flex;
    align-items: baseline;
    overflow-wrap: break-word;
  }

  .pw-versus {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 1rem;
    margin-bottom: 0.5rem;
    font-size: clamp(1.5rem, 6vw, 2rem);
  }
  .pw-fighter {
    overflow-wrap: break-word;
    padding-bottom: 0.25rem;
    border-bottom: 0.25rem solid var(--pw-side);
    color: var(--pw-side);
    text-decoration: none;
  }
  .pw-fighter:first-child {
    text-align: right;
  }
  .pw-fighter:hover {
    text-decoration: underline;
  }
  .pw-fighter:focus-visible {
    outline: 2px solid var(--pw-side);
    outline-offset: 0.25rem;
    box-shadow: none;
  }
  .pw-vs {
    color: var(--pw-muted-color);
    font-size: 0.6em;
    font-weight: normal;
    text-transform: uppercase;
  }
  .pw-battle-meta {
    text-align: center;
    color: var(--pw-muted-color);
  }

  .pw-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 24rem), 1fr));
    column-gap: var(--pico-grid-column-gap);
    align-items: start;
  }
  .pw-card-header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: baseline;
    gap: 0 1rem;
  }
  .pw-card-header h2 {
    margin: 0;
    font-size: 1rem;
  }
  .pw-card-header small {
    color: var(--pw-muted-color);
  }

  .pw-matrix {
    margin-bottom: 0;
  }
  .pw-matrix th, .pw-matrix td {
    padding-inline: 0.5rem;
    background: transparent;
    vertical-align: top;
  }
  .pw-matrix thead th {
    font-size: 0.875em;
    font-weight: normal;
    color: var(--pw-muted-color);
  }
  .pw-matrix tbody tr:last-child > * {
    border-bottom: none;
  }
  .pw-matrix .pw-total {
    font-weight: bold;
  }

  .pw-explainer {
    margin-bottom: var(--pico-block-spacing-vertical);
    font-size: 0.875em;
  }
  .pw-explainer dt {
    font-weight: bold;
  }
  .pw-explainer dd {
    margin-bottom: 0.5rem;
  }

  .pw-game > header hgroup {
    margin-bottom: 0.5rem;
  }
  .pw-game h2 {
    font-size: 1.375rem;
  }
  .pw-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.375rem;
    margin: 0;
    padding: 0;
    font-size: 0.75rem;
  }
  .pw-chips li {
    list-style: none;
    margin: 0;
    padding: 0.125rem 0.5rem;
    border: 1px solid var(--pico-muted-border-color);
    border-radius: 1rem;
  }
  .pw-game details summary {
    font-weight: bold;
  }
  .pw-game pre {
    font-size: 0.8125rem;
    line-height: 1.5;
    padding: 0.75rem 1rem;
    border-radius: var(--pico-border-radius);
  }
  /* an underline as well as a tint, so marked text is not told by color alone */
  .pw-game pre mark {
    background: color-mix(in srgb, var(--pw-side) 25%, transparent);
    color: var(--pico-color);
    text-decoration: underline;
    text-decoration-color: var(--pw-side);
    text-decoration-thickness: 2px;
    text-underline-offset: 0.2em;
  }
  .pw-note {
    padding: 0.75rem 1rem;
    border: 1px dashed var(--pico-muted-border-color);
    border-radius: var(--pico-border-radius);
    color: var(--pw-muted-color);
    font-size: 0.875em;
  }

  .pw-scoring {
    margin-bottom: var(--pico-spacing);
    padding-top: var(--pico-spacing);
    border-top: 1px solid var(--pico-muted-border-color);
  }
  .pw-scoring h3 {
    color: var(--pw-muted-color);
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .pw-split-sides {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    margin: 0;
    padding: 0;
  }
  .pw-split-sides > li {
    list-style: none;
    margin: 0;
  }
  .pw-split-sides > li:last-child {
    text-align: right;
  }
  .pw-split-score {
    display: block;
    color: var(--pw-side);
    font-size: 1.5rem;
    font-weight: bold;
    line-height: 1.2;
  }
  .pw-split-bar {
    display: flex;
    height: 0.75rem;
    margin: 0.5rem 0;
    border-radius: 0.375rem;
    background: var(--pico-muted-border-color);
    overflow: hidden;
  }
  .pw-split-bar > span {
    background: var(--pw-side);
  }
  .pw-split-bar > span + span {
    border-left: 2px solid var(--pico-card-background-color);
  }
  .pw-scoring small {
    color: var(--pw-muted-color);
  }
  .pw-scoring details {
    margin: 0.5rem 0 0;
  }

  .pw-walk {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }
  .pw-walk > :nth-child(2) {
    text-align: center;
  }
  .pw-walk > :last-child {
    text-align: right;
  }
  .pw-walk [role=button] {
    white-space: nowrap;
  }
</style>
